<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPTPM kernels</title>
  <style>
    body { max-width: 700px; margin: 40px 16px; padding: 0; color: #222; background: #fff; font: 15px/1.6 monospace; }
    h1 { font-size: 20px; font-weight: normal; }
    pre { border-left: 2px solid #ddd; padding-left: 16px; }
    a { color: #06c; }
  </style>
</head>
<body>
  <h1>GPTPM kernels</h1>
  <pre id="tree">gptpm-kernels/
├── linux/
│   └── not published yet :(
└── linux-lts/
    └── not published yet :(</pre>
  <p><a href="latest/linux.json">linux metadata</a> · <a href="latest/linux-lts.json">linux-lts metadata</a></p>
  <script>
    async function show(channel, prefix) {
      try {
        const data = await fetch(`latest/${channel}.json`).then(r => r.json());
        if (!data.version || data.status === 'not-published') return;
        const lines = document.getElementById('tree').textContent.split('\n');
        const index = lines.findIndex(line => line.includes(`${prefix}/`));
        if (index < 0 || index + 1 >= lines.length) return;
        lines[index + 1] = lines[index + 1].replace('not published yet :(', data.version);
        document.getElementById('tree').textContent = lines.join('\n');
      } catch (_) {}
    }
    show('linux', 'linux');
    show('linux-lts', 'linux-lts');
  </script>
</body>
</html>
