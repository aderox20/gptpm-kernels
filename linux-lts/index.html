<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPTPM kernels - linux-lts/</title>
  <style>
    body { max-width: 700px; margin: 40px 16px; padding: 0; color: #222; background: #fff; font: 15px/1.6 monospace; }
    h1 { font-size: 20px; font-weight: normal; }
    a { color: #06c; }
  </style>
</head>
<body>
  <h1>Index of linux-lts/</h1>
  <p><a href="../">../</a></p>
  <p><a href="IFNOT.md">IFNOT.md</a> <button data-file="IFNOT.md">Download File</button></p>
  <script>
    async function downloadFile(file) {
      const blob = await fetch(file).then(response => response.blob());
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.split('/').pop();
      a.click();
      URL.revokeObjectURL(url);
    }
    document.querySelectorAll('[data-file]').forEach(button =>
      button.addEventListener('click', () => downloadFile(button.dataset.file)));
  </script>
  <p><a href="../latest/linux-lts.json">linux-lts.json</a></p>
</body>
</html>
