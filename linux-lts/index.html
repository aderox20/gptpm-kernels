<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPTPM kernels - linux-lts/</title>
  <style>
    body { max-width: 700px; margin: 40px 16px; padding: 0; color: #222; background: #fff; font: 15px/1.6 monospace; }
    h1 { font-size: 20px; font-weight: normal; }
    a { color: #06c; }
  </style>
</head>
<body>
  <h1>Index of linux-lts/</h1>
  <p><a href="../">../</a></p>
  <p><a href="IFNOT.md" class="download" onclick="downloadFile(event, this)">IFNOT.md</a></p>
  <script>
    async function downloadFile(event, link) {
      event.preventDefault();
      const blob = await fetch(link.href).then(response => response.blob());
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = link.pathname.split('/').pop();
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
  <p><a href="../latest/linux-lts.json">linux-lts.json</a></p>
</body>
</html>
